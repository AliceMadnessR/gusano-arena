<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gusano · Arena PvP</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a111b;color:#edf5ff;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;top:20px;left:24px;pointer-events:none}h1{margin:0;font-size:24px;letter-spacing:-1px}small{color:#8eabc0}#board{position:fixed;right:20px;top:20px;background:#101c2cce;border:1px solid #ffffff16;border-radius:16px;padding:16px;width:210px;font-size:13px}#board div{padding:4px 0;display:flex;justify-content:space-between;gap:10px}#board span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#070d17b5;backdrop-filter:blur(8px)}section{width:min(92vw,420px);padding:32px;background:#111f30;border:1px solid #ffffff18;border-radius:24px;box-shadow:0 25px 100px #0009}h2{font-size:36px;letter-spacing:-2px;margin:0 0 8px}p{line-height:1.6;color:#a5bbcd;font-size:14px}label{display:block;font-size:12px;color:#a5bbcd;margin-top:18px}input,button{width:100%;padding:14px;border-radius:12px;font:inherit}input{background:#091422;color:white;border:1px solid #33465a;margin-top:6px;outline-color:#a7f36b}button{background:#a7f36b;color:#14260b;border:0;font-weight:800;cursor:pointer;margin-top:20px}#notice{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);font-size:13px;color:#b3c6d8;background:#101c2cdd;padding:10px 18px;border-radius:30px;text-align:center;pointer-events:none}#error{color:#ff8c9c}#boost{position:fixed;bottom:80px;right:20px;width:75px;height:75px;border-radius:50%;opacity:.85;touch-action:none;user-select:none}#back{background:#283d50;color:#d5e8fa;margin-top:10px} @media(max-width:600px){#board{width:145px;font-size:11px;padding:10px}#hud{left:14px;top:14px}h1{font-size:19px}#notice{width:85%;bottom:14px}}
</style><canvas id="game"></canvas><div id="hud"><h1>gusano<span style="color:#a7f36b">.arena</span></h1><small id="stats">PvP en tiempo real</small></div><aside id="board"><strong>TOP GUSANOS</strong><div id="ranking"></div></aside><div id="notice">Mouse o dedo para girar · WASD / flechas · Espacio para acelerar</div><button id="boost" aria-label="Acelerar">⚡</button><div id="overlay"><section><h2 id="title">Entrá a la arena.</h2><p id="description">Comé, crecé y encerrá a tus rivales.<br>Cabeza contra cuerpo: morís vos.<br>Cabeza contra cabeza: mueren ambos.</p><form id="form"><label>Tu nombre<input id="name" maxlength="18" required placeholder="Ej. El Gusano" autocomplete="nickname"></label><label>Sala<input id="room" maxlength="30" value="principal" required></label><label>Servidor de la partida<input id="server-url" type="url" placeholder="https://tu-servidor.onrender.com"></label><button id="play">Jugar →</button></form><button id="back" hidden>Cambiar nombre o sala</button><p id="error" role="status"></p><small>Compartí la misma dirección y sala con tus amigos.</small></section></div>
<script>
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),colors=['#a7f36b','#69d9ff','#ff88bf','#ffc56d','#bb9aff','#76eed0'];let state=null,id='',room='',angle=0,boost=false,connected=false,inFlight=false,camera={x:1200,y:1200},keys=new Set(),pointer=null,last=performance.now(),lastGood=Date.now();
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;}addEventListener('resize',resize);resize();
async function api(route,data){
const value=$('server-url').value.trim();
if(!value&&(location.hostname.endsWith('.netlify.app')||location.protocol==='file:'))throw Error('Falta el servidor de la partida. Ingresá su URL pública en Servidor. Netlify aloja la página pero no ejecuta server.cjs.');
let base=location.origin;if(value){const url=new URL(value);if(!['http:','https:'].includes(url.protocol))throw Error('URL inválida.');if(location.protocol==='https:'&&url.protocol!=='https:')throw Error('El servidor necesita HTTPS.');base=url.origin;}
const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
try{const r=await fetch(base+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal});
const raw=await r.text();let body;try{body=JSON.parse(raw);}catch{throw Error('La dirección no responde como servidor del juego (HTTP '+r.status+'). Revisá la URL: subir el HTML no inicia server.cjs.');}
if(!r.ok)throw Error(body.error||'Error de conexión.');if(!body.id||!Array.isArray(body.players)||!Array.isArray(body.food))throw Error('Respuesta incompatible del servidor.');return body;
}catch(e){if(e.name==='AbortError')throw Error('El servidor tardó en responder. Esperá y reintentá.');if(e instanceof TypeError)throw Error('No se pudo conectar. Revisá que el servidor esté encendido y su URL sea correcta.');throw e;}finally{clearTimeout(timeout);}}

function accept(s){state=s;id=s.id;lastGood=Date.now();const me=s.players.find(p=>p.id===id);if(me){$('stats').textContent=me.score+' puntos · '+s.players.filter(p=>p.alive).length+' en arena · '+room;if(!me.alive){$('overlay').style.display='grid';$('title').textContent='Te atraparon.';$('description').textContent=me.reason;$('play').textContent='Volver a jugar →';$('back').hidden=false;}else{$('overlay').style.display='none';$('notice').textContent=Date.now()<me.safe?'Protección inicial: buscá espacio para moverte.':'Mouse / dedo para girar · Espacio / ⚡ para acelerar (consume largo)';}}const ranking=$('ranking');ranking.replaceChildren();s.players.filter(p=>p.alive).sort((a,b)=>b.score-a.score).slice(0,8).forEach((p,i)=>{const line=document.createElement('div'),name=document.createElement('span'),points=document.createElement('b');name.textContent=(i+1)+'. '+p.name+(p.id===id?' (vos)':'');name.style.color=p.color;points.textContent=p.score;line.append(name,points);ranking.append(line);});}
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('play').disabled=true;try{if(connected&&state?.players.find(p=>p.id===id)&&!state.players.find(p=>p.id===id).alive){accept(await api('/respawn',{id,room}));}else{room=$('room').value.trim().toLowerCase()||'principal';accept(await api('/join',{name:$('name').value,room}));const me=state.players.find(p=>p.id===id);camera={...me.body[0]};angle=0;connected=true;}}catch(e){$('error').textContent=e.message;}finally{$('play').disabled=false;}};
$('back').onclick=()=>{connected=false;id='';$('title').textContent='Entrá a la arena.';$('play').textContent='Jugar →';$('back').hidden=true;};
setInterval(async()=>{if(!connected||inFlight)return;inFlight=true;try{accept(await api('/sync',{id,room,angle,boost:boost||keys.has(' ')}));$('error').textContent='';}catch(e){$('error').textContent=e.message;if(Date.now()-lastGood>6000){connected=false;$('overlay').style.display='grid';$('title').textContent='Conexión perdida';$('play').textContent='Reconectar →';}}finally{inFlight=false;}},70);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();boost=false;pointer=null;});canvas.addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY};});canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')pointer=null;});$('boost').onpointerdown=e=>{e.preventDefault();boost=true;$('boost').setPointerCapture(e.pointerId);};$('boost').onpointerup=$('boost').onpointercancel=()=>boost=false;
function draw(t){const dt=Math.min((t-last)/1000,.1);last=t;let me=state?.players.find(p=>p.id===id);if(me?.alive){camera.x+=(me.body[0].x-camera.x)*Math.min(1,dt*12);camera.y+=(me.body[0].y-camera.y)*Math.min(1,dt*12);let x=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),y=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(x||y)angle=Math.atan2(y,x);else if(pointer&&Math.hypot(pointer.x-innerWidth/2,pointer.y-innerHeight/2)>15)angle=Math.atan2(pointer.y-innerHeight/2,pointer.x-innerWidth/2);}ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#0b1420';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.translate(innerWidth/2-camera.x,innerHeight/2-camera.y);ctx.strokeStyle='#172636';ctx.lineWidth=1;const minX=camera.x-innerWidth/2,minY=camera.y-innerHeight/2;for(let x=Math.floor(minX/60)*60;x<minX+innerWidth;x+=60){ctx.beginPath();ctx.moveTo(x,minY);ctx.lineTo(x,minY+innerHeight);ctx.stroke();}for(let y=Math.floor(minY/60)*60;y<minY+innerHeight;y+=60){ctx.beginPath();ctx.moveTo(minX,y);ctx.lineTo(minX+innerWidth,y);ctx.stroke();}ctx.strokeStyle='#ff657f';ctx.lineWidth=5;ctx.strokeRect(0,0,state?.world||2400,state?.world||2400);if(state){for(const f of state.food){if(Math.abs(f.x-camera.x)>innerWidth/2+20||Math.abs(f.y-camera.y)>innerHeight/2+20)continue;ctx.fillStyle=colors[f.c]||colors[0];ctx.beginPath();ctx.arc(f.x,f.y,3.5,0,Math.PI*2);ctx.fill();}for(const p of state.players){if(!p.alive)continue;ctx.globalAlpha=Date.now()<p.safe ? 0.55 : 1;ctx.strokeStyle=p.color;ctx.lineWidth=18;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();p.body.forEach((b,i)=>i?ctx.lineTo(b.x,b.y):ctx.moveTo(b.x,b.y));ctx.stroke();const h=p.body[0],neck=p.body[1],a=Math.atan2(h.y-neck.y,h.x-neck.x);ctx.save();ctx.translate(h.x,h.y);ctx.rotate(a);for(const ey of [-5,5]){ctx.fillStyle='white';ctx.beginPath();ctx.arc(4,ey,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#122033';ctx.beginPath();ctx.arc(5.5,ey,2,0,Math.PI*2);ctx.fill();}ctx.restore();ctx.globalAlpha=1;ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#f0f7ff';ctx.fillText(p.name,h.x,h.y-23);}}requestAnimationFrame(draw);}requestAnimationFrame(draw);


</script></html>
